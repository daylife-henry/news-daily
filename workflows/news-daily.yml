name: 每日新闻日报推送

on:
  schedule:
    # 每天 UTC 0:00 运行 = 北京时间 8:00
    # GitHub Actions cron 可能有几分钟延迟，属正常现象
    - cron: '0 0 * * *'
  # 支持手动触发测试
  workflow_dispatch:

jobs:
  push-news:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行新闻工作流
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python news_cloud.py

      - name: 提交历史记录
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add history.json news_final.md 2>/dev/null || true
          git commit -m "chore: update news history $(date -u +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push

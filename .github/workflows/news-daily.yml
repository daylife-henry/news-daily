name: 每日新闻日报推送

on:
  schedule:
    # 北京时间 08:05 \ 10:05 \ 12:05 \ 14:05 \ 16:05 \ 18:05 \ 20:05 \ 22:05 八次次推送
    # UTC = 北京时间 - 8小时
    - cron: '5 0 * * *'     # 北京 08:05
    - cron: '5 2 * * *'     # 北京 10:05
    - cron: '5 4 * * *'     # 北京 12:05
    - cron: '5 6 * * *'     # 北京 14:05
    - cron: '5 8 * * *'     # 北京 16:05
    - cron: '5 10 * * *'    # 北京 18:05
    - cron: '5 12 * * *'    # 北京 20:05
    - cron: '5 14 * * *'    # 北京 22:05
  # 支持手动触发测试
  workflow_dispatch:

jobs:
  push-news:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 运行新闻工作流
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          QQ_TO_EMAIL: ${{ secrets.QQ_TO_EMAIL }}
        run: pip install markdown && python news_cloud.py

      - name: 提交历史记录
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add history.json 2>/dev/null || true
          git commit -m "chore: update news history $(date -u +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push
